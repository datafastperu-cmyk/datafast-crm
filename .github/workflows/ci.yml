name: CI

# Origen (2026-07-28): un solo día de auditoría destapó cinco queries rotas contra
# columnas migradas, una suite de tests que llevaba meses sin compilar (y por tanto sin
# ejecutarse) y el cron de facturación fallando a diario en silencio. Ninguna de las tres
# cosas necesitaba una herramienta nueva para detectarse: necesitaba que alguien las
# ejecutara. Eso es lo que hace este workflow.
#
# La regla es que FALLE y bloquee el merge. Un CI que informa pero no bloquea envejece
# igual que las suites que vinimos a rescatar.

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene sentido gastar
# minutos validando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, tests y esquema
    runs-on: ubuntu-latest

    # Postgres 16 como en la VPS (16.14). Validar contra otra versión daría una confianza
    # que no se sostiene en el despliegue.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     datafast_db_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB:       datafast_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datafast_db_user -d datafast_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST:     localhost
      DB_PORT:     '5432'
      DB_NAME:     datafast_db
      DB_USER:     datafast_db_user
      DB_PASSWORD: ci_password
      DB_SSL:      'false'
      NODE_OPTIONS: '--max-old-space-size=4096'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        # --runInBand: en el runner de CI, jest en paralelo agota la memoria con este
        # número de suites. Tarda algo más y termina.
        run: npx jest --runInBand --ci

      # ── Instalación desde cero ─────────────────────────────────
      # Cumple dos funciones a la vez: comprueba que la cadena COMPLETA aplica sobre una
      # base vacía —o sea, que el ERP se puede instalar en un VPS nuevo, que es la
      # directriz de portabilidad multi-VPS— y produce el esquema real contra el que
      # validar las queries crudas, sin depender de un snapshot que envejece.
      #
      # Hasta el 2026-07-28 esto era imposible: `core` referenciaba tablas de `auxiliary`
      # y se ejecutaban en bloques separados. `migration:run:all` los intercala por
      # timestamp, que es lo que TypeORM hace de forma nativa.
      - name: Instalación desde cero (migraciones core + auxiliary)
        run: npm run migration:run:all

      # ── Ola 2, lote de dinero — la guarda ejercitada con datos, no con cero filas ──────
      # La instalación limpia de arriba corre las migraciones de Paso A sobre una base
      # vacía: el conteo de huérfanos y la comparación de dinero pasan sobre conjuntos
      # vacíos y no prueban nada (hallazgo del propietario, 2026-08-17 — PC-04, guarda
      # decorativa). Este paso siembra filas a mano —incluida una huérfana a propósito— y
      # llama a la MISMA función que las migraciones usan, para que su primera vez viendo
      # un dato real sea aquí, no en producción.
      - name: Paso A del lote de dinero — guardas con datos sembrados
        run: npm run dinero:verificar-paso-a

      - name: Volcar esquema resultante
        run: |
          PGPASSWORD=ci_password psql -h localhost -U datafast_db_user -d datafast_db -tAc \
            "SELECT table_name || ':' || string_agg(column_name, ',' ORDER BY column_name) \
             FROM information_schema.columns \
             WHERE table_schema='public' GROUP BY table_name ORDER BY table_name" > /tmp/schema.txt
          echo "tablas: $(wc -l < /tmp/schema.txt)"

      - name: Verificar queries crudas contra el esquema
        # Las columnas dentro de template strings son invisibles para el compilador: así
        # se colaron `em.serie_boleta`, `em.telefono` y `cl.empresa_nombre`, que rompían
        # facturación y notificaciones EN SILENCIO — sin tráfico real no se notaba nada.
        run: npm run sql:check -- /tmp/schema.txt src

      # ── F-0.1-A §6, orden 2 y 3 — E02-10 y E02-08, con techo congelado ─────────
      # Las dos FALLAN hoy (22 columnas de proveedor en `servicios`, 3 de estado en
      # `clientes`) y es lo esperado: deuda declarada con techo, no chequeo apagado
      # (regla 5 del anexo). El paso solo rompe el build si el número SUBE — o si baja
      # y nadie actualizó el techo, para que el progreso no quede invisible.
      - name: Frontera del Core — E02-10 (proveedor) y E02-08 (estado en Cliente)
        run: node scripts/verificar-frontera-core.mjs /tmp/schema.txt

      # ── F-0.1-A §6.1 — las cinco comprobaciones que existían y el CI no ejecutaba ──────
      # Existían, funcionaban (probado localmente contra instalación limpia, Ola 0,
      # 2026-08-16) y no vigilaban nada porque nadie las disparaba. Aviso honesto: de las
      # cinco, solo `sql:check` (arriba) tiene una condición de fallo real. Estas cuatro más
      # `db:check` (abajo) son generadores/informes — ninguna llama `process.exit` con un
      # código de error por lo que encuentra, `aislamiento:check` incluso fuerza
      # `exitCode = 0` a propósito (ver su propio comentario). Enchufarlas da VISIBILIDAD
      # en cada push, no un gate nuevo: convertir alguna en assertion con umbral es decisión
      # aparte, no de esta ola.
      - name: Autorización de endpoints mutantes (informe)
        run: npm run autorizacion:check

      - name: Aislamiento multi-tenant (informe — ADR-031 ya lo hace imposible de romper)
        run: npm run aislamiento:check

      - name: Inventario del Core comercial (regenerado, no se compara contra umbral aún)
        run: npm run inventario -- A

      - name: Auditoría de interacciones entre módulos (regenerada)
        run: npm run interacciones

      - name: Esquema real vs. entidades TypeORM (informe)
        # `schema:log` no crea `typeorm_metadata` si falta (a diferencia de `synchronize()`),
        # y en una instalación limpia real esa tabla nunca existe: revienta en vez de
        # comparar. Hallazgo Ola 0 (2026-08-16). `preparar-schema-log.ts` reproduce solo el
        # paso de bookkeeping que falta — nunca sincroniza tablas ni columnas.
        run: |
          TS_NODE_PROJECT=tsconfig.migration.json npx ts-node -T scripts/preparar-schema-log.ts
          npm run db:check

  frontend:
    name: Frontend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
