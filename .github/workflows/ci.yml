name: CI

# Origen (2026-07-28): un solo día de auditoría destapó cinco queries rotas contra
# columnas migradas, una suite de tests que llevaba meses sin compilar (y por tanto sin
# ejecutarse) y el cron de facturación fallando a diario en silencio. Ninguna de las tres
# cosas necesitaba una herramienta nueva para detectarse: necesitaba que alguien las
# ejecutara. Eso es lo que hace este workflow.
#
# La regla es que FALLE y bloquee el merge. Un CI que informa pero no bloquea envejece
# igual que las suites que vinimos a rescatar.

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene sentido gastar
# minutos validando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, tests y esquema
    runs-on: ubuntu-latest

    # Nota: NO se levanta Postgres ni se corren las migraciones aquí, aunque sería lo
    # ideal. Al intentarlo (2026-07-28) se descubrió que la cadena de migraciones NO
    # aplica sobre una base vacía: `core` referencia tablas que crea `auxiliary` y son dos
    # comandos separados, así que no existe hoy un procedimiento de instalación desde
    # cero que funcione. Meterlo en CI ahora bloquearía TODOS los merges por un problema
    # preexistente y ajeno a cada PR. Se usa un snapshot del esquema de producción y
    # arreglar la cadena queda como tarea propia — ver schema.snapshot.txt.
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        # --runInBand: en el runner de CI, jest en paralelo agota la memoria con este
        # número de suites. Tarda algo más y termina.
        run: npx jest --runInBand --ci

      - name: Verificar queries crudas contra el esquema
        # Las columnas dentro de template strings son invisibles para el compilador: así
        # se colaron `em.serie_boleta`, `em.telefono` y `cl.empresa_nombre`, que rompían
        # facturación y notificaciones EN SILENCIO — sin tráfico real no se notaba nada.
        #
        # El snapshot se regenera desde la BD con:
        #   psql -tAc "SELECT table_name || ':' || string_agg(column_name, ',' ORDER BY column_name)
        #              FROM information_schema.columns WHERE table_schema='public'
        #              GROUP BY table_name ORDER BY table_name" > backend/schema.snapshot.txt
        # Toda migración que añada o quite columnas debe actualizarlo en el mismo PR.
        run: npm run sql:check -- schema.snapshot.txt src

  frontend:
    name: Frontend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
