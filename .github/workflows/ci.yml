name: CI

# Origen (2026-07-28): un solo día de auditoría destapó cinco queries rotas contra
# columnas migradas, una suite de tests que llevaba meses sin compilar (y por tanto sin
# ejecutarse) y el cron de facturación fallando a diario en silencio. Ninguna de las tres
# cosas necesitaba una herramienta nueva para detectarse: necesitaba que alguien las
# ejecutara. Eso es lo que hace este workflow.
#
# La regla es que FALLE y bloquee el merge. Un CI que informa pero no bloquea envejece
# igual que las suites que vinimos a rescatar.

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene sentido gastar
# minutos validando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, tests y esquema
    runs-on: ubuntu-latest

    # Postgres 16 como en la VPS (16.14). Validar contra otra versión daría una confianza
    # que no se sostiene en el despliegue.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     datafast_db_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB:       datafast_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datafast_db_user -d datafast_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST:     localhost
      DB_PORT:     '5432'
      DB_NAME:     datafast_db
      DB_USER:     datafast_db_user
      DB_PASSWORD: ci_password
      DB_SSL:      'false'
      NODE_OPTIONS: '--max-old-space-size=4096'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        # --runInBand: en el runner de CI, jest en paralelo agota la memoria con este
        # número de suites. Tarda algo más y termina.
        run: npx jest --runInBand --ci

      # ── Instalación desde cero ─────────────────────────────────
      # Cumple dos funciones a la vez: comprueba que la cadena COMPLETA aplica sobre una
      # base vacía —o sea, que el ERP se puede instalar en un VPS nuevo, que es la
      # directriz de portabilidad multi-VPS— y produce el esquema real contra el que
      # validar las queries crudas, sin depender de un snapshot que envejece.
      #
      # Hasta el 2026-07-28 esto era imposible: `core` referenciaba tablas de `auxiliary`
      # y se ejecutaban en bloques separados. `migration:run:all` los intercala por
      # timestamp, que es lo que TypeORM hace de forma nativa.
      - name: Instalación desde cero (migraciones core + auxiliary)
        run: npm run migration:run:all

      - name: Volcar esquema resultante
        run: |
          PGPASSWORD=ci_password psql -h localhost -U datafast_db_user -d datafast_db -tAc \
            "SELECT table_name || ':' || string_agg(column_name, ',' ORDER BY column_name) \
             FROM information_schema.columns \
             WHERE table_schema='public' GROUP BY table_name ORDER BY table_name" > /tmp/schema.txt
          echo "tablas: $(wc -l < /tmp/schema.txt)"

      - name: Verificar queries crudas contra el esquema
        # Las columnas dentro de template strings son invisibles para el compilador: así
        # se colaron `em.serie_boleta`, `em.telefono` y `cl.empresa_nombre`, que rompían
        # facturación y notificaciones EN SILENCIO — sin tráfico real no se notaba nada.
        run: npm run sql:check -- /tmp/schema.txt src

  frontend:
    name: Frontend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
